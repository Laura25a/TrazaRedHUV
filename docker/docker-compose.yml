# El docker-compose.yml de verdad está en la RAÍZ del repositorio (requisito de
# entrega del proyecto final). Este archivo solo lo incluye, para que quien siga
# haciendo "cd docker && docker compose up -d" levante exactamente lo mismo,
# con el mismo nombre de proyecto y los mismos volúmenes.
name: docker

include:
  - path: ../docker-compose.yml
    project_directory: ..
