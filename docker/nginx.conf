# nginx del servicio "front": sirve la interfaz y es la PUERTA ÚNICA del sistema.
# El túnel de Cloudflare apunta aquí, así que todo el tráfico de internet pasa
# por estas protecciones (R03):
#   * Cabeceras de seguridad en todas las respuestas (nosniff, X-Frame-Options).
#   * Limitación de tasa: una ráfaga de peticiones recibe 429 (Too Many Requests).
#   * No anuncia la versión de nginx.
# Rutas:
#   /           -> archivos de frontend/ (index.html, css, js)
#   /api/...    -> contenedor api (FastAPI)      p. ej. /api/login -> api:8000/login
#   /fhir/...   -> contenedor hapi-fhir          p. ej. /fhir/metadata
# El servicio de IA (ml) NO tiene ruta aquí: solo la api le habla.

# ── Limitación de tasa (R03) ─────────────────────────────────────────────────
# Detrás del túnel, todas las peticiones llegan desde el contenedor cloudflared;
# la IP real del visitante viene en la cabecera CF-Connecting-IP. Se usa esa
# (o la IP directa si no hay túnel) para que cada visitante tenga su propio cupo.
map $http_cf_connecting_ip $cliente_ip {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
# La misma IP en texto, para pasársela a la API (X-Real-IP)
map $http_cf_connecting_ip $ip_real {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
# API: 10 peticiones por segundo por visitante (ráfagas de hasta 20 se toleran).
# El login no necesita un límite aparte: la adivinación de contraseñas ya la
# frena el bloqueo de la cuenta al 3er intento (R02).
limit_req_zone $cliente_ip zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;                      # no revela la versión de nginx

    root  /usr/share/nginx/html;
    index index.html;

    # Permite subir imágenes médicas de hasta 20 MB (la API acepta hasta 15 MB)
    client_max_body_size 20m;

    limit_req_status 429;                   # lo que recibe quien se pasa del límite

    # DNS interno de Docker. nginx averigua la IP de "api" y "hapi-fhir" en
    # CADA petición (cache 10 s) y no solo al arrancar: así, cuando se
    # reconstruye la api y su contenedor cambia de IP, nginx no se queda
    # apuntando a la vieja (eso daba 502 Bad Gateway hasta reiniciar front).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_srv  api:8000;
    set $fhir_srv hapi-fhir:8080;

    # Cabeceras de seguridad (R03). Ojo: en nginx, un add_header dentro de un
    # "location" ANULA los del server; por eso cada location las repite.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Canal en tiempo real (R17, Persona 4): Server-Sent Events.
    # proxy_buffering off es OBLIGATORIO: sin esto nginx guarda los eventos y
    # el túnel los entrega tarde. Conexión larga: no cuenta para el límite por segundo.
    location /api/eventos/ {
        rewrite ^/api/(.*)$ /$1 break;          # quita el prefijo /api
        proxy_pass http://$api_srv;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ip_real;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Accel-Buffering "no" always;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        rewrite ^/api/(.*)$ /$1 break;          # quita el prefijo /api
        proxy_pass http://$api_srv;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ip_real;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /fhir/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://$fhir_srv;            # pasa la ruta tal cual (/fhir/...)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: cualquier otra ruta devuelve index.html
    # no-store: mientras desarrollamos, el navegador no se queda con copias viejas
    location / {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
