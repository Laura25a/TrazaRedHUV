# nginx del servicio "front": sirve la interfaz y hace de puerta única.
# Así el navegador solo habla con http://localhost:8080 y nginx reparte:
#   /        -> archivos de frontend/ (index.html, css, js)
#   /api/... -> contenedor api (FastAPI)      p. ej. /api/login -> api:8000/login
#   /fhir/...-> contenedor hapi-fhir          p. ej. /fhir/metadata
# Ventaja: mismo origen (sin CORS) y un solo puerto para el túnel.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Permite subir imágenes médicas de hasta 20 MB (la API acepta hasta 15 MB)
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api:8000/;            # la "/" final quita el prefijo /api
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /fhir/ {
        proxy_pass http://hapi-fhir:8080/fhir/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: cualquier otra ruta devuelve index.html
    # no-store: mientras desarrollamos, el navegador no se queda con copias viejas
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
